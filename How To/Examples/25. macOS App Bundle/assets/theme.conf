# How the dial is drawn. This file is read at run time, so you can edit the
# copy inside Build/Sundial.app/Contents/Resources and press Cmd-R in the app
# to see the change - no rebuild, no relaunch.
#
# Blank lines and lines starting with '#' are ignored.
# Colours are #RRGGBB.

title  = Artisan Sundial

# Dial size, as a fraction of the window's shorter side (0.2 - 0.5).
radius = 0.38

background = 1B1A17
face       = ECDFC2
rim        = 8A6F3C
mark       = 4A3C24
shadow     = 2B2118
gnomon     = C2703D
